<!doctype html>
<!-- index.html — 실행 진입점: <canvas> 하나만 둔다 (팀 프로젝트 기술 제약) -->
<!-- VS Code에서 파일을 바로 열거나 Live Server로 열어도 동작하도록 type="module" 을 쓰지 않는다 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>옹기종기 공방</title>   <!-- (2026-11-26) 프로젝트 이름 확정: 「점말 옹기장」(가칭) → 「옹기종기 공방」 (시작 화면 로고와 같게) -->
  <style>
    /* 캔버스를 전체 화면으로 만드는 것 외에는 CSS를 쓰지 않는다 */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a211c; }
    /* touch-action: none — 드래그 중 화면이 스크롤·확대되지 않게 막는다 (휴대폰 터치 조작에 필수) */
    /* (2026-11-24) 높이 100vh → 100dvh: 모바일 크롬의 100vh 는 주소창·아래 탭이 숨었을 때의 높이라서
       바가 보이는 동안 캔버스 아래(버튼 줄·슬롯 바)가 탭 뒤로 잘렸다. dvh 는 지금 보이는 영역의 높이.
       dvh 를 모르는 옛 브라우저는 뒤 줄을 무시하고 앞 줄의 100vh 를 쓴다 */
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none;
             user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <canvas></canvas>

  <!-- gl-matrix: 자료실에서 안내한 벡터·행렬 라이브러리 (전역 glMatrix) -->
  <script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>

  <!-- 순서가 중요하다: 뒤 파일이 앞 파일의 객체를 쓴다 -->
  <!-- (2026-11-25) ?v=번호 = 캐시 무시용. GitHub Pages 는 파일을 10분 캐시하라고 보내서 휴대폰이 예전 js 를 계속 썼다.
       코드를 바꿔 올릴 때 이 번호와 main.js 의 BUILD 를 같이 올린다 (화면 맨 위 가운데에 BUILD 가 보인다) -->
  <!-- core: 어느 화면이든 쓰는 도구 (엔진 역할). 특정 화면 전용 코드는 넣지 않는다 -->
  <script src="./src/core/program.js?v=40"></script>
  <script src="./src/core/text.js?v=40"></script>
  <script src="./src/core/image.js?v=40"></script>
  <script src="./src/core/mesh.js?v=40"></script>
  <script src="./src/core/camera.js?v=40"></script>
  <script src="./src/core/ui.js?v=40"></script>
  <script src="./src/core/input.js?v=40"></script>

  <!-- shared: 두 화면 이상이 같이 쓰는 셰이더·소품 -->
  <script src="./src/shared/potShader.js?v=40"></script>
  <script src="./src/shared/wheel.js?v=40"></script>

  <!-- pot: 옹기를 만드는 공통 틀 -->
  <script src="./src/pot/pot.js?v=40"></script>
  <script src="./src/shared/workbench.js?v=40"></script>
  <!-- (2026-11-25) 모든 화면 위에 덮는 층: 단계 완료 팝업 + 일시정지 (Scenes·Work 를 쓴다 — 함수 안에서만 부르므로 순서는 여기면 된다) -->
  <script src="./src/shared/overlay.js?v=40"></script>

  <!-- scenes: 화면마다 하나. 화면 전용 셰이더·메시는 그 파일 안에 -->
  <script src="./src/scenes/scenes.js?v=40"></script>
  <script src="./src/scenes/start.js?v=40"></script>
  <script src="./src/scenes/stage1-knead-bar.js?v=40"></script>
  <script src="./src/scenes/stage2-base.js?v=40"></script>
  <script src="./src/scenes/stage3-stack.js?v=40"></script>
  <script src="./src/scenes/stage4-decorate.js?v=40"></script>
  <script src="./src/scenes/stage5-glaze.js?v=40"></script>
  <script src="./src/scenes/stage6-gama.js?v=40"></script>
  <script src="./src/scenes/stage7-result.js?v=40"></script>
  <script src="./src/scenes/ending.js?v=40"></script>   <!-- (2026-11-25) 마무리 화면 「옹기장이가 되었어요!」 -->
  <script src="./src/scenes/gallery/gallery.js?v=40"></script>

  <script src="./src/main.js?v=40"></script>
</body>
</html>
